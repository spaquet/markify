name: Build and Release DMG

# Releases are immutable in this repo, so assets can't be added after a
# release is published. Pushing a vX.Y tag builds both DMGs and a universal
# Sparkle update archive, attaches them and the Sparkle appcast to a draft
# release (reusing a draft you prepared for that tag, with its notes), and
# only then publishes it. The app reads its update feed from
# releases/latest/download/appcast.xml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:  # Build DMGs as artifacts without releasing

permissions:
  contents: write  # Required to upload release assets

jobs:
  build:
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - archs: arm64
            suffix: as
            derived_data_path: build-as
          - archs: x86_64
            suffix: intel
            derived_data_path: build-intel
          # Sparkle update archive, one for both architectures
          - archs: arm64 x86_64
            suffix: update
            derived_data_path: build-update

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Markify.xcodeproj \
            -scheme Markify

      # Crash reports go to Sentry only when the SENTRY_DSN repository secret is
      # set. A tagged release fails without it; a manual build only warns.
      - name: Build Markify for ${{ matrix.archs }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_DSN" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then echo "::error::The SENTRY_DSN secret is not set."; exit 1; fi
            echo "::warning::The SENTRY_DSN secret is not set; this build reports no crashes."
          fi
          # Checked before the build so a tag fails early; the upload is the next step.
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then echo "::error::The SENTRY_AUTH_TOKEN secret is not set."; exit 1; fi
            echo "::warning::The SENTRY_AUTH_TOKEN secret is not set; debug symbols won't be uploaded."
          fi
          # The scheme Xcode generates turns coverage on for tests and passes it to `build` too, which
          # instrumented every release up to 2.2.2. DEPLOYMENT_POSTPROCESSING makes `build` strip the
          # binaries as `archive` would; the dSYMs are written before stripping and uploaded below.
          xcodebuild \
            -project Markify.xcodeproj \
            -scheme Markify \
            -configuration Release \
            ARCHS="${{ matrix.archs }}" \
            ONLY_ACTIVE_ARCH=NO \
            CLANG_COVERAGE_MAPPING=NO \
            ENABLE_CODE_COVERAGE=NO \
            DEPLOYMENT_POSTPROCESSING=YES \
            -derivedDataPath ${{ matrix.derived_data_path }} \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            SENTRY_DSN="$SENTRY_DSN" \
            clean build

      # Without the dSYMs, Sentry shows Markify's own frames as <unknown>. Each matrix build has its own
      # UUIDs (the two DMGs and the universal Sparkle update), so all three upload. Ad hoc signing later
      # doesn't change them.
      - name: Upload debug symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: markify-ax
          SENTRY_PROJECT: markify
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then exit 0; fi
          brew install getsentry/tools/sentry-cli
          sentry-cli debug-files upload --include-sources --wait \
            "${{ matrix.derived_data_path }}/Build/Products/Release"

      - name: Build and bundle markify CLI
        run: |
          CLI_BINARIES=()
          for ARCH in ${{ matrix.archs }}; do
            swift build --package-path MarkifyCLI -c release --arch "$ARCH" --scratch-path "cli-build-$ARCH"
            CLI_BINARIES+=("$(swift build --package-path MarkifyCLI -c release --arch "$ARCH" --scratch-path "cli-build-$ARCH" --show-bin-path)/markify")
          done
          # Contents/Helpers, not Contents/MacOS: on a case-insensitive volume
          # MacOS/markify is MacOS/Markify, and the CLI would replace the app.
          APP="${{ matrix.derived_data_path }}/Build/Products/Release/Markify.app"
          mkdir -p "$APP/Contents/Helpers"
          APP_CLI="$APP/Contents/Helpers/markify"
          if [ "${#CLI_BINARIES[@]}" -eq 1 ]; then
            cp "${CLI_BINARIES[0]}" "$APP_CLI"
          else
            lipo -create "${CLI_BINARIES[@]}" -output "$APP_CLI"
          fi
          chmod +x "$APP_CLI"

      - name: Check the app and CLI executables
        run: |
          APP="${{ matrix.derived_data_path }}/Build/Products/Release/Markify.app"
          EXECUTABLE="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          if ! otool -L "$EXECUTABLE" | grep -q 'SwiftUI.framework'; then
            echo "::error::$EXECUTABLE is not the Markify app (no SwiftUI)."
            exit 1
          fi
          if [ "$(/bin/ls "$APP/Contents/MacOS")" != "Markify" ]; then
            echo "::error::Contents/MacOS should hold only Markify: $(ls "$APP/Contents/MacOS")"
            exit 1
          fi
          "$APP/Contents/Helpers/markify" --help | grep -q 'markify view'
          for BINARY in "$EXECUTABLE" "$APP/Contents/PlugIns/MarkifyQuickLook.appex/Contents/MacOS/MarkifyQuickLook"; do
            if size -m "$BINARY" | grep -q '__LLVM_COV\|__llvm_prf_cnts'; then
              echo "::error::$BINARY is built with code coverage instrumentation."
              exit 1
            fi
          done

      # The build is only linker-signed, which `codesign --verify` and Sparkle
      # reject. Preserve Quick Look’s sandbox while keeping the main app and
      # its private image helper unsandboxed, matching the Xcode builds.
      - name: Sign ad hoc
        run: |
          codesign --force --deep --sign - "${{ matrix.derived_data_path }}/Build/Products/Release/Markify.app"
          codesign --force --sign - --entitlements QuickLook/QuickLook.entitlements "${{ matrix.derived_data_path }}/Build/Products/Release/Markify.app/Contents/PlugIns/MarkifyQuickLook.appex"
          codesign --force --sign - "${{ matrix.derived_data_path }}/Build/Products/Release/Markify.app"
          codesign --verify --deep --strict --verbose=2 "${{ matrix.derived_data_path }}/Build/Products/Release/Markify.app"

      - name: Install create-dmg
        if: matrix.suffix != 'update'
        run: brew install create-dmg

      - name: Create DMG for ${{ matrix.archs }}
        if: matrix.suffix != 'update'
        run: |
          create-dmg \
            --volname "Markify ${{ env.VERSION }} (${{ matrix.suffix == 'as' && 'Apple Silicon' || 'Intel' }})" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Markify.app" 175 120 \
            --hide-extension "Markify.app" \
            --app-drop-link 425 120 \
            "markify-${{ matrix.suffix }}.dmg" \
            "${{ matrix.derived_data_path }}/Build/Products/Release/Markify.app"

      - name: Generate SHA256 checksum
        if: matrix.suffix != 'update'
        run: |
          shasum -a 256 "markify-${{ matrix.suffix }}.dmg" > \
            "markify-${{ matrix.suffix }}.dmg.sha256"
          cat "markify-${{ matrix.suffix }}.dmg.sha256"

      - name: Create and sign the Sparkle update archive
        if: matrix.suffix == 'update'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          APP="${{ matrix.derived_data_path }}/Build/Products/Release/Markify.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" markify-update.zip
          # Build number, version and minimum macOS for the appcast item
          PLIST="$APP/Contents/Info.plist"
          {
            echo "BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
            echo "SHORT_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
            echo "MIN_SYSTEM=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$PLIST")"
          } > markify-update.env
          # Only tag builds are signed; manual runs have nothing to publish.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
              echo "::error::The SPARKLE_PRIVATE_KEY secret is missing, so the update can't be signed."
              exit 1
            fi
            SIGN_UPDATE="${{ matrix.derived_data_path }}/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update"
            SIGNATURE=$(echo "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - -p markify-update.zip)
            # Installed copies check the update against the app's public key.
            swift scripts/verify-update-signature.swift \
              "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$PLIST")" "$SIGNATURE" markify-update.zip
            echo "ENCLOSURE_ATTRIBUTES='sparkle:edSignature=\"$SIGNATURE\" length=\"$(stat -f%z markify-update.zip)\"'" >> markify-update.env
          fi
          cat markify-update.env

      - name: Upload build as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: markify-${{ matrix.suffix }}-v${{ env.VERSION }}
          path: |
            markify-${{ matrix.suffix }}.dmg
            markify-${{ matrix.suffix }}.dmg.sha256
            markify-update.zip
            markify-update.env
          if-no-files-found: error
          retention-days: 90

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}

    steps:
      - name: Download DMGs
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release if needed
        run: |
          if gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null | grep -q true; then
            echo "Using existing draft for $TAG"
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG is already published and immutable. Delete it or tag a new version."
            exit 1
          else
            gh release create "$TAG" --draft --verify-tag --title "Markify ${TAG#v}" --generate-notes
          fi

      - name: Write the Sparkle appcast
        run: |
          source dist/markify-update.env
          rm dist/markify-update.env
          if [ -z "$ENCLOSURE_ATTRIBUTES" ]; then
            echo "::error::The update archive wasn't signed."
            exit 1
          fi
          # The release notes, shown by Sparkle as Markdown; CDATA can't contain "]]>".
          NOTES=$(gh release view "$TAG" --json body -q .body | sed 's/]]>/]]]]><![CDATA[>/g')
          cat > dist/appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Markify</title>
              <link>https://github.com/${GH_REPO}</link>
              <item>
                <title>Markify ${SHORT_VERSION}</title>
                <link>https://github.com/${GH_REPO}/releases/tag/${TAG}</link>
                <sparkle:version>${BUILD}</sparkle:version>
                <sparkle:shortVersionString>${SHORT_VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>${MIN_SYSTEM}</sparkle:minimumSystemVersion>
                <pubDate>$(date -u -R)</pubDate>
                <description sparkle:format="markdown"><![CDATA[${NOTES}]]></description>
                <enclosure url="https://github.com/${GH_REPO}/releases/download/${TAG}/markify-update.zip" ${ENCLOSURE_ATTRIBUTES} type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          XML
          cat dist/appcast.xml

      - name: Attach DMGs and publish
        run: |
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --latest
