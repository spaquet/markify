name: Build and Release DMG

# Releases are immutable in this repo, so assets can't be added after a
# release is published. Pushing a vX.Y tag builds both DMGs, attaches them
# to a draft release (reusing a draft you prepared for that tag, with its
# notes), and only then publishes it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:  # Build DMGs as artifacts without releasing

permissions:
  contents: write  # Required to upload release assets

jobs:
  build:
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            suffix: as
            derived_data_path: build-as
          - arch: x86_64
            suffix: intel
            derived_data_path: build-intel

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Markify.xcodeproj \
            -scheme Markify

      - name: Build Markify for ${{ matrix.arch }}
        run: |
          xcodebuild \
            -project Markify.xcodeproj \
            -scheme Markify \
            -configuration Release \
            -arch ${{ matrix.arch }} \
            -derivedDataPath ${{ matrix.derived_data_path }} \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG for ${{ matrix.arch }}
        run: |
          create-dmg \
            --volname "Markify ${{ env.VERSION }} (${{ matrix.suffix == 'as' && 'Apple Silicon' || 'Intel' }})" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Markify.app" 175 120 \
            --hide-extension "Markify.app" \
            --app-drop-link 425 120 \
            "markify-${{ matrix.suffix }}.dmg" \
            "${{ matrix.derived_data_path }}/Build/Products/Release/Markify.app"

      - name: Generate SHA256 checksum
        run: |
          shasum -a 256 "markify-${{ matrix.suffix }}.dmg" > \
            "markify-${{ matrix.suffix }}.dmg.sha256"
          cat "markify-${{ matrix.suffix }}.dmg.sha256"

      - name: Upload DMG and checksum as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: markify-${{ matrix.suffix }}-v${{ env.VERSION }}
          path: |
            markify-${{ matrix.suffix }}.dmg
            markify-${{ matrix.suffix }}.dmg.sha256
          retention-days: 90

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}

    steps:
      - name: Download DMGs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release if needed
        run: |
          if gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null | grep -q true; then
            echo "Using existing draft for $TAG"
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG is already published and immutable. Delete it or tag a new version."
            exit 1
          else
            gh release create "$TAG" --draft --verify-tag --title "Markify ${TAG#v}" --generate-notes
          fi

      - name: Attach DMGs and publish
        run: |
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --latest
