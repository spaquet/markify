name: Tests

# Runs on every pull request and push to main. The "Packages" and "App" jobs
# are required checks in the main branch ruleset, so keep their names.
# UI tests are left out: they need a logged-in window server and are flaky
# on hosted runners.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Packages
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      # MarkifyMarkdown arrives with the editor-fragments branch.
      - name: Test MarkifyMarkdown
        if: hashFiles('MarkifyMarkdown/Package.swift') != ''
        run: swift test --package-path MarkifyMarkdown

      - name: Test OKFKit
        run: swift test --package-path OKFKit

      - name: Test markify CLI
        run: |
          swift test --package-path MarkifyCLI
          bash scripts/test-cli.sh
          python3 scripts/test-agent-integrations.py

      - name: Test OpenCode package
        run: |
          npm install --prefix "$RUNNER_TEMP/markify-opencode" "$PWD/agents/opencode" --install-links --ignore-scripts --no-audit --no-fund
          node scripts/test-opencode.mjs "$RUNNER_TEMP/markify-opencode/node_modules/markify-opencode/index.js"

      # help/*.md is built into the app's Help Book and the website; both must be regenerated with it.
      - name: Check generated help
        run: scripts/build-help.sh --check

  app:
    name: App
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test Markify
        run: |
          xcodebuild \
            -project Markify.xcodeproj \
            -scheme Markify \
            -destination 'platform=macOS' \
            -only-testing MarkifyTests \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/MarkifyTests.xcresult" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            test

      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: MarkifyTests-results
          path: ${{ runner.temp }}/MarkifyTests.xcresult
